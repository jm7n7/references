# Cloud Run Service Configuration
# ====================================================================
# This file defines a Cloud Run service configuration
# Can be used with: gcloud run services replace-traffic
# ====================================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: my-service
  annotations:
    # Cloud Run specific annotations
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        # Autoscaling configuration
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        
        # CPU allocation
        run.googleapis.com/cpu-throttling: "true"
        
        # Execution environment
        run.googleapis.com/execution-environment: gen2
        
        # VPC connector (if needed)
        # run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/REGION/connectors/CONNECTOR_NAME
        
        # Egress configuration
        # run.googleapis.com/vpc-access-egress: all-traffic
        
    spec:
      # Container configuration
      containers:
      - image: gcr.io/PROJECT_ID/my-service:latest
        ports:
        - name: http1
          containerPort: 8080
        
        # Environment variables
        env:
        - name: PORT
          value: "8080"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: ENVIRONMENT
          value: "production"
        # Add your custom environment variables here
        # - name: DATABASE_URL
        #   value: "your-database-url"
        
        # Resource limits
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          # requests:
          #   cpu: "1"
          #   memory: "1Gi"
        
        # Startup probe
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 0
          timeoutSeconds: 240
          periodSeconds: 240
          failureThreshold: 1
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 3
        
        # Command and args (if needed)
        # command: ["python"]
        # args: ["main.py"]
      
      # Service account (for accessing other GCP services)
      # serviceAccountName: my-service-account@PROJECT_ID.iam.gserviceaccount.com
      
      # Timeout (in seconds, max 3600)
      timeoutSeconds: 300
      
      # Container concurrency (max requests per container instance)
      containerConcurrency: 80
      
      # Request timeout
      # requestTimeout: 300s
      
  # Traffic allocation
  traffic:
  - percent: 100
    latestRevision: true

# ====================================================================
# Usage Examples:
# ====================================================================
#
# 1. Deploy Cloud Run service from YAML:
#    gcloud run services replace YAML/cloud-run-service.yaml \
#      --region=us-central1
#
# 2. Deploy with gcloud command (alternative):
#    gcloud run deploy my-service \
#      --image=gcr.io/PROJECT_ID/my-service:latest \
#      --region=us-central1 \
#      --platform=managed \
#      --allow-unauthenticated \
#      --memory=2Gi \
#      --cpu=2 \
#      --timeout=300 \
#      --max-instances=10 \
#      --min-instances=1
#
# 3. Update traffic allocation:
#    gcloud run services update-traffic my-service \
#      --to-latest \
#      --region=us-central1
#
# 4. Set environment variables:
#    gcloud run services update my-service \
#      --update-env-vars KEY=VALUE \
#      --region=us-central1
#
# ====================================================================
# Notes:
# ====================================================================
# - Replace PROJECT_ID with your GCP project ID
# - Replace my-service with your actual service name
# - Health check endpoints (/healthz) should return 200 OK
# - PORT environment variable is automatically set by Cloud Run
# - For secrets, use Secret Manager and reference via env vars
# - Execution environment gen2 provides better performance
# ====================================================================

