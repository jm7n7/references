# Cloud Build Configuration for GCP
# ====================================================================
# This file defines the build steps for Google Cloud Build
# Used for CI/CD pipelines and automated Docker image builds
# ====================================================================

# Build steps
steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '-f'
      - 'Docker/Dockerfile'
      - '.'
    id: 'build-image'

  # Step 2: Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}'
    id: 'push-image'
    waitFor: ['build-image']

  # Step 3: Deploy to Cloud Run (optional - uncomment if using Cloud Run)
  # - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  #   entrypoint: gcloud
  #   args:
  #     - 'run'
  #     - 'deploy'
  #     - '${_SERVICE_NAME}'
  #     - '--image'
  #     - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$SHORT_SHA'
  #     - '--region'
  #     - '${_REGION}'
  #     - '--platform'
  #     - 'managed'
  #     - '--allow-unauthenticated'
  #   id: 'deploy-cloud-run'
  #   waitFor: ['push-image']

# Substitution variables (can be overridden via gcloud command or Cloud Build triggers)
substitutions:
  _SERVICE_NAME: 'my-service'
  _REGION: 'us-central1'

# Images to be pushed to the registry
images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

# Build options
options:
  # Machine type for build (faster builds, higher cost)
  # Options: 'N1_HIGHCPU_8', 'N1_HIGHCPU_32', 'E2_HIGHCPU_8', 'E2_HIGHCPU_32'
  machineType: 'E2_HIGHCPU_8'
  
  # Logging options
  logging: CLOUD_LOGGING_ONLY
  
  # Build timeout (default: 600s, max: 3600s)
  # timeout: '1200s'

# Build timeout (overall)
timeout: '1200s'

# ====================================================================
# Usage Examples:
# ====================================================================
#
# 1. Build and push image manually:
#    gcloud builds submit --config=YAML/cloudbuild.yaml \
#      --substitutions=_SERVICE_NAME=my-service
#
# 2. Create a Cloud Build trigger:
#    gcloud builds triggers create github \
#      --repo-name=REPO_NAME \
#      --repo-owner=OWNER \
#      --branch-pattern="^main$" \
#      --build-config=YAML/cloudbuild.yaml \
#      --substitutions=_SERVICE_NAME=my-service,_REGION=us-central1
#
# 3. Build with custom substitutions:
#    gcloud builds submit --config=YAML/cloudbuild.yaml \
#      --substitutions=_SERVICE_NAME=my-service,_REGION=us-west1
#
# 4. Build for specific commit/tag:
#    gcloud builds submit --config=YAML/cloudbuild.yaml \
#      --substitutions=_SERVICE_NAME=my-service,SHORT_SHA=abc123
#
# ====================================================================
# Notes:
# ====================================================================
# - $PROJECT_ID: Automatically set by Cloud Build
# - $SHORT_SHA: Short commit SHA (first 7 characters)
# - $COMMIT_SHA: Full commit SHA
# - $BRANCH_NAME: Branch name that triggered the build
# - $TAG_NAME: Tag name if build was triggered by a tag
# - Custom substitutions use _ prefix (e.g., _SERVICE_NAME)
# ====================================================================

